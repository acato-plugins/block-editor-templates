# See: https://github.com/10up/action-wordpress-plugin-asset-update
# Pushes readme.txt and the .wordpress-org assets to WordPress.org when they
# change on main. Code ships only through a tag (deploy.yml), so code changes
# in the same push are ignored here instead of failing the run.
name: Plugin asset/readme update
on:
  push:
    branches:
      - main
    paths:
      - readme.txt
      - .wordpress-org/**
# Both WordPress.org workflows commit to the same SVN repository. A release merge changes
# readme.txt, so deploy_assets.yml (push to main) runs right before deploy.yml (the release tag),
# and two commits racing on trunk/readme.txt make the second fail with an SVN conflict. One
# group, never cancelled, makes them run one after the other.
concurrency:
  group: wordpress-org-svn
  cancel-in-progress: false
jobs:
  trunk:
    name: Push to main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: WordPress.org plugin asset/readme update
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          IGNORE_OTHER_FILES: true
