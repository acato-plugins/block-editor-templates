# See: https://github.com/10up/action-wordpress-plugin-asset-update
# Pushes readme.txt and the .wordpress-org assets to WordPress.org when they
# change on main. Code ships only through a tag (deploy.yml), so code changes
# in the same push are ignored here instead of failing the run.
name: Plugin asset/readme update
on:
  push:
    branches:
      - main
    paths:
      - readme.txt
      - .wordpress-org/**
# Both WordPress.org workflows commit to the same SVN repository. A release merge changes
# readme.txt, so deploy_assets.yml (push to main) runs right before deploy.yml (the release tag),
# and two commits racing on trunk/readme.txt make the second fail with an SVN conflict. One
# group, never cancelled, makes them run one after the other.
concurrency:
  group: wordpress-org-svn
  cancel-in-progress: false
jobs:
  trunk:
    name: Push to main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Whoever pushed sends the readme and assets with their own SVN account when
      # SVN_<LOGIN>_USERNAME and SVN_<LOGIN>_PASSWORD are set, and with the
      # company account otherwise. See .github/scripts/svn-account.sh.
      - name: Find the SVN secrets of who triggered this
        id: who
        env:
          LOGIN: ${{ github.actor }}
        run: .github/scripts/svn-account.sh key "$LOGIN"

      - name: Choose personal or company SVN credentials
        id: svn
        env:
          KEY: ${{ steps.who.outputs.key }}
          PERSONAL_USERNAME: ${{ secrets[format('SVN_{0}_USERNAME', steps.who.outputs.key)] }}
          PERSONAL_PASSWORD: ${{ secrets[format('SVN_{0}_PASSWORD', steps.who.outputs.key)] }}
          COMPANY_USERNAME: ${{ secrets.SVN_USERNAME }}
          COMPANY_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: .github/scripts/svn-account.sh choose

      - name: WordPress.org plugin asset/readme update
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_PASSWORD: ${{ steps.svn.outputs.variant == 'personal' && secrets[format('SVN_{0}_PASSWORD', steps.who.outputs.key)] || secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ steps.svn.outputs.variant == 'personal' && secrets[format('SVN_{0}_USERNAME', steps.who.outputs.key)] || secrets.SVN_USERNAME }}
          IGNORE_OTHER_FILES: true
