# See: https://github.com/10up/action-wordpress-plugin-deploy
name: Deploy to WordPress.org
on:
  push:
    tags:
      - "*"
# Both WordPress.org workflows commit to the same SVN repository. A release merge changes
# readme.txt, so deploy_assets.yml (push to main) runs right before deploy.yml (the release tag),
# and two commits racing on trunk/readme.txt make the second fail with an SVN conflict. One
# group, never cancelled, makes them run one after the other.
concurrency:
  group: wordpress-org-svn
  cancel-in-progress: false
# The job only reads the repository; the SVN credentials are the only secrets it needs.
permissions:
  contents: read
jobs:
  tag:
    name: New tag
    runs-on: ubuntu-latest
    steps:
      # Actions that receive the SVN credentials are pinned to a commit, so a change to their
      # tag or branch cannot change what runs with them. Update the hash together with the comment.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      # Release only what reached main through review: a tag on any other commit stops here.
      # This guards against a mistaken tag; who may push tags at all is set in the repository's
      # tag rules on GitHub.
      - name: Check that the tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at a commit that is not on main. Release from main only."
            exit 1
          fi

      # Whoever pushed the tag releases with their own SVN account when
      # SVN_<LOGIN>_USERNAME and SVN_<LOGIN>_PASSWORD are set, and with the
      # company account otherwise. See .github/scripts/svn-account.sh.
      - name: Find the SVN secrets of who triggered this
        id: who
        env:
          LOGIN: ${{ github.actor }}
        run: .github/scripts/svn-account.sh key "$LOGIN"

      - name: Choose personal or company SVN credentials
        id: svn
        env:
          KEY: ${{ steps.who.outputs.key }}
          PERSONAL_USERNAME: ${{ secrets[format('SVN_{0}_USERNAME', steps.who.outputs.key)] }}
          PERSONAL_PASSWORD: ${{ secrets[format('SVN_{0}_PASSWORD', steps.who.outputs.key)] }}
          COMPANY_USERNAME: ${{ secrets.SVN_USERNAME }}
          COMPANY_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: .github/scripts/svn-account.sh choose

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0 (stable)
        env:
          SVN_PASSWORD: ${{ steps.svn.outputs.variant == 'personal' && secrets[format('SVN_{0}_PASSWORD', steps.who.outputs.key)] || secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ steps.svn.outputs.variant == 'personal' && secrets[format('SVN_{0}_USERNAME', steps.who.outputs.key)] || secrets.SVN_USERNAME }}
