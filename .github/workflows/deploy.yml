# See: https://github.com/10up/action-wordpress-plugin-deploy
name: Deploy to WordPress.org
on:
  push:
    tags:
      - "*"
# Both WordPress.org workflows commit to the same SVN repository. A release merge changes
# readme.txt, so deploy_assets.yml (push to main) runs right before deploy.yml (the release tag),
# and two commits racing on trunk/readme.txt make the second fail with an SVN conflict. One
# group, never cancelled, makes them run one after the other.
concurrency:
  group: wordpress-org-svn
  cancel-in-progress: false
jobs:
  tag:
    name: New tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
